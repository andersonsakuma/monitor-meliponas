name: Compilar firmware BeeMeter

on:
  push:
    branches: [main]
    paths: ['firmware/esp_tela_sakuma/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Núcleo ESP32 e bibliotecas
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli lib install "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library" "DHT sensor library" "HX711" "NimBLE-Arduino@1.4.3"
      - name: Compilar
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=default --output-dir saida firmware/esp_tela_sakuma
      - uses: actions/upload-artifact@v4
        with:
          name: BeeMeter-firmware
          path: |
            saida/*.merged.bin
            saida/*.ino.bin
