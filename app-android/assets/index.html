<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Monitor Meliponas</title>
<script src="config.js"></script>
<style>
:root{
  --madeira:#3B2414; --madeira2:#5A3A22; --mel:#F2B233; --mel-claro:#FCEFC9;
  --folha:#2F6B3A; --folha-claro:#E2F0E3; --alerta:#B3261E; --alerta-claro:#FBE3E1;
  --papel:#FFFFFF; --fundo:#F3F0EB; --texto:#24180F; --suave:#6B5D52; --linha:#DDD4CA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);
  font-family:Roboto,"Noto Sans",system-ui,sans-serif;font-size:17px;line-height:1.4}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--texto);width:100%;padding:12px;border:2px solid var(--linha);
  border-radius:10px;background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--mel)}
header{background:var(--madeira);color:#fff;padding:14px 18px 16px}
header .quem{font-size:22px;font-weight:700}
header .quando{color:#E9D8C4;font-size:15px}
main{padding:14px 14px 96px;max-width:640px;margin:0 auto}
h2{font-size:21px;margin:18px 4px 10px}
h3{font-size:18px;margin:18px 0 8px}
p{margin:0 0 10px}
.cartao{background:var(--papel);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--linha)}
.botao{display:block;width:100%;padding:16px;border-radius:12px;font-weight:700;font-size:18px;text-align:center;
  background:var(--mel);color:var(--madeira);margin-top:10px}
.botao.verde{background:var(--folha);color:#fff}
.botao.vermelho{background:var(--alerta);color:#fff}
.botao.claro{background:#fff;border:2px solid var(--linha);color:var(--texto)}
.botao:active{transform:scale(.98)}
.suave{color:var(--suave);font-size:15px}
.aviso{background:var(--alerta-claro);border-left:6px solid var(--alerta);padding:12px 14px;border-radius:8px;margin:10px 0}
.dica{background:var(--mel-claro);border-left:6px solid var(--mel);padding:12px 14px;border-radius:8px;margin:10px 0}
.ok{background:var(--folha-claro);border-left:6px solid var(--folha);padding:12px 14px;border-radius:8px;margin:10px 0}

/* favos das colônias */
.favos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px}
.favo{aspect-ratio:1/1.08;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:#E6DDD2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--suave)}
.favo small{font-size:11px;font-weight:600}
.favo.feito{background:var(--folha);color:#fff}
.favo.problema{background:var(--alerta);color:#fff}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--suave);margin:6px 2px}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.barra{height:12px;background:#E6DDD2;border-radius:6px;overflow:hidden;margin:8px 0}
.barra span{display:block;height:100%;background:var(--folha);transition:width .3s}

/* formulário da colônia */
.campo{margin:16px 0}
.campo > label{display:block;font-weight:700;margin-bottom:8px}
.opcoes{display:flex;gap:8px;flex-wrap:wrap}
.opcoes button{flex:1 1 30%;min-height:52px;padding:10px 6px;border-radius:10px;border:2px solid var(--linha);background:#fff;font-weight:600;font-size:16px}
.opcoes button.sel{background:var(--folha);border-color:var(--folha);color:#fff}
.opcoes button.sel.ruim{background:var(--alerta);border-color:var(--alerta)}
.opcoes button.sel.medio{background:var(--mel);border-color:var(--mel);color:var(--madeira)}
.topo-form{position:sticky;top:0;background:var(--madeira);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:5}
.topo-form button{color:#fff;font-size:26px;width:44px;height:44px}
.topo-form .t{font-size:20px;font-weight:700;flex:1}
.tela-cheia{position:fixed;inset:0;background:var(--fundo);overflow-y:auto;z-index:20;display:none}
.tela-cheia.aberta{display:block}
.tela-cheia .conteudo{padding:8px 14px 40px;max-width:640px;margin:0 auto}
.info-col{font-size:14px;color:var(--suave);margin-top:4px}

/* listas */
.item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.item .bola{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.item .meio{flex:1}
.etq{display:inline-block;font-size:13px;font-weight:700;padding:3px 8px;border-radius:20px;margin-right:4px}
.etq.v{background:var(--folha-claro);color:var(--folha)}
.etq.r{background:var(--alerta-claro);color:var(--alerta)}
.etq.m{background:var(--mel-claro);color:#7A5208}
ol.passos{padding-left:24px;margin:6px 0}
ol.passos li{margin-bottom:8px}
ul.sub{padding-left:20px;margin:6px 0}
details{background:#fff;border:1px solid var(--linha);border-radius:12px;margin-bottom:10px}
summary{padding:16px;font-weight:700;font-size:18px;list-style:none}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";float:right;font-size:22px;color:var(--suave)}
details[open] summary:after{content:"–"}
details .det{padding:0 16px 14px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{border-bottom:1px solid var(--linha);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--suave);font-weight:600}

/* navegação */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linha);display:flex;z-index:10}
nav button{flex:1;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--suave)}
nav button svg{width:26px;height:26px}
nav button.ativo{color:var(--madeira)}
nav button.ativo svg{color:var(--mel);filter:drop-shadow(0 0 0 var(--madeira))}
.oculto{display:none!important}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--madeira);color:#fff;padding:12px 18px;border-radius:24px;font-weight:600;opacity:0;transition:opacity .25s;z-index:50;pointer-events:none;max-width:90%;text-align:center}
#toast.vis{opacity:1}

.midias{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.midia{position:relative;border-radius:10px;overflow:hidden;background:#E6DDD2;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;font-size:14px;color:var(--madeira)}
.midia img{width:100%;height:100%;object-fit:cover}
.midia .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:30px}
.midia .env{position:absolute;bottom:4px;left:4px;background:var(--folha);color:#fff;font-size:11px;padding:2px 6px;border-radius:8px}
.midia.audio{background:var(--mel-claro)}
.midia.audio .play{font-size:30px}
.botoes-midia{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.botoes-midia button{padding:12px 4px;border-radius:10px;border:2px solid var(--linha);background:#fff;font-weight:700;font-size:15px;min-height:64px}
.botoes-midia button.gravando{background:var(--alerta);border-color:var(--alerta);color:#fff}
header{display:flex;align-items:center;gap:10px}
header .id{flex:1;min-width:0}
.sinc{font-size:13px;color:#E9D8C4;margin-top:2px}
.sinc b{color:var(--mel)}
.logos{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0}
.logos{gap:18px}.logos img{height:84px;max-width:52%;object-fit:contain}.logos .marca{display:flex;align-items:center;gap:6px}.logos .marca img{height:64px}.logos .marca b{color:#7A4A12;font-size:15px;line-height:1.05}
.logos .txt{font-weight:800;color:var(--madeira);font-size:15px;border:2px solid var(--linha);border-radius:8px;padding:8px 10px;background:#fff}
.aparelho{background:#fff;border:2px solid var(--linha);border-radius:12px;padding:12px;margin:10px 0}
.aparelho .tit{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.aparelho .id{font-family:monospace;font-size:15px;color:var(--madeira)}
.aparelho.ok{border-color:var(--folha);background:var(--folha-claro)}
.aparelho.falha{border-color:var(--alerta);background:var(--alerta-claro)}
.leituras{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.leituras div{background:#fff;border-radius:8px;padding:6px;text-align:center;border:1px solid var(--linha)}
.leituras b{display:block;font-size:17px;color:var(--madeira)}
.leituras span{font-size:11.5px;color:var(--suave)}
.progresso{height:8px;background:#E6DDD2;border-radius:4px;overflow:hidden;margin-top:8px}
.progresso span{display:block;height:100%;background:var(--mel);transition:width .3s}
.achados button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:12px;border:2px solid var(--linha);border-radius:10px;background:#fff;margin-top:8px;font-weight:700}
</style>
</head>
<body>

<!-- Escolha do monitor (primeiro uso) -->
<div id="boasVindas" class="tela-cheia">
  <div class="conteudo" style="padding-top:40px">
    <h2 style="font-size:26px">Monitor Meliponas</h2><div class="logos"><img src="logos/ipe-fis.png" alt="IPÊ | FIS" onerror="this.outerHTML='<span class=txt>IPÊ | FIS</span>'"><span class="marca"><img src="logos/amazonia-bee.png" alt="Amazônia Bee" onerror="this.parentNode.outerHTML='<span class=txt>Amazônia Bee</span>'"><b>Amazônia<br>Bee</b></span></div>
    <p>Aplicativo de registro das visitas semanais às 12 colônias do protótipo de meliponicultura — FIS | IPÊ e Amazônia Bee, Cametá do Ramos (AM).</p>
    <h3>Quem vai usar este celular?</h3>
    <button class="botao" onclick="escolherMonitor('Sr. Jatir')">Sr. Jatir</button>
    <button class="botao" onclick="escolherMonitor('Dona Maria Diniz')">Dona Maria Diniz</button>
    <p class="suave" style="margin-top:14px">Dá para trocar depois, em Ajustes.</p>
  </div>
</div>

<header>
  <div class="id"><div class="quem" id="hQuem">Monitor</div><div class="quando" id="hQuando"></div><div class="sinc" id="hSinc"></div></div>
</header>

<main>
  <section id="aba-visita"></section>
  <section id="aba-historico" class="oculto"></section>
  <section id="aba-guia" class="oculto"></section>
  <section id="aba-ajustes" class="oculto"></section>
</main>

<!-- Formulário de uma colônia -->
<div id="formColonia" class="tela-cheia">
  <div class="topo-form"><button onclick="fecharColonia()" aria-label="Voltar">‹</button><div class="t" id="fTitulo">Colônia</div></div>
  <div class="conteudo" id="fConteudo"></div>
</div>

<!-- Busca de aparelhos -->
<div id="telaBusca" class="tela-cheia" style="z-index:30">
  <div class="topo-form"><button onclick="fecharBusca()" aria-label="Voltar">‹</button><div class="t" id="bTitulo">Aparelhos</div></div>
  <div class="conteudo" id="bConteudo"></div>
</div>

<!-- Resumo / detalhe de visita -->
<div id="telaResumo" class="tela-cheia">
  <div class="topo-form"><button onclick="fecharResumo()" aria-label="Voltar">‹</button><div class="t" id="rTitulo">Resumo da visita</div></div>
  <div class="conteudo" id="rConteudo"></div>
</div>

<nav>
  <button data-aba="visita" class="ativo" onclick="irAba('visita')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/></svg>Visita</button>
  <button data-aba="historico" onclick="irAba('historico')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Histórico</button>
  <button data-aba="guia" onclick="irAba('guia')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6"/></svg>Guia</button>
  <button data-aba="ajustes" onclick="irAba('ajustes')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Ajustes</button>
</nav>
<div id="toast"></div>

<script>
/* ---------- dados ---------- */
var CHAVE = 'meliponas_v1';
var LOGOS_HTML='<div class="logos"><img src="logos/ipe-fis.png" alt="IPÊ | FIS" onerror="this.outerHTML=\'<span class=txt>IPÊ | FIS</span>\'"><span class="marca"><img src="logos/amazonia-bee.png" alt="Amazônia Bee"><b>Amazônia<br>Bee</b></span></div>';
var DIAS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var CAMPOS = [
  {id:'dados',  rot:'Os dados foram baixados para o celular?', ops:['Sim','Não'], ruins:['Não']},
  {id:'mov',    rot:'Movimento de abelhas na entrada', ops:['Muito','Pouco','Nenhum'], medios:['Pouco'], ruins:['Nenhum']},
  {id:'pragas', rot:'Tem formigas, forídeos, cupins ou outras pragas?', ops:['Não','Sim'], ruins:['Sim']},
  {id:'caixa',  rot:'Estado da caixa', ops:['Bom','Úmida','Com estrago'], medios:['Úmida'], ruins:['Com estrago']},
  {id:'placa',  rot:'Placa solar e fios', ops:['Bom','Sujo','Danificado'], medios:['Sujo'], ruins:['Danificado']},
  {id:'aparelho',rot:'Aparelho', ops:['No lugar','Mexido','Sumiu'], ruins:['Mexido','Sumiu']},
  {id:'manejo', rot:'Manejo feito nesta colônia desde a última visita', ops:['Nenhum','Colheita','Alimentação','Troca de melgueira','Divisão'], medios:['Colheita','Alimentação','Troca de melgueira','Divisão']}
];
function semBluetooth(){ return !!(window.MM_WEB && !window.MM_WEB_BLE); }
var NORMAL = {dados:'Sim',mov:'Muito',pragas:'Não',caixa:'Bom',placa:'Bom',aparelho:'No lugar',manejo:'Nenhum'};
var O_QUE_FAZER = {
  dados:'Chegue mais perto do aparelho e tente de novo. Se continuar sem passar, avise hoje no grupo do projeto.',
  mov:'Colônia sem movimento: tire uma foto e avise hoje.',
  pragas:'Tire uma foto das pragas e avise hoje.',
  caixa:'Caixa com estrago ou mofo: tire uma foto e avise hoje.',
  placa:'Placa quebrada ou fio cortado: tire foto, não mexa e avise hoje.',
  aparelho:'Aparelho mexido ou desaparecido: tire foto do local e avise hoje a equipe e a Amazônia Bee.'
};

function novoEstado(){
  var cols=[]; for(var i=1;i<=12;i++) cols.push({n:i,especie:'',ambiente:'',melgueira:'',aparelho:'',local:''});
  return {monitor:'',agenda:{dia:'',hora:''},colonias:cols,visitas:[],atual:null};
}
function uuid(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c=='x'?r:(r&3|8)).toString(16);}); }
function completarEstado(){
  if(!E.dispositivo) E.dispositivo=uuid();
  var C=window.CONFIG||{};
  if(!E.servidor) E.servidor={url:C.url||'',chave:C.chave||'',codigo:C.codigo||''};
  if(!E.servidor.url && C.url){ E.servidor.url=C.url; E.servidor.chave=C.chave; E.servidor.codigo=C.codigo; }
  if(E.midiasSoWifi===undefined) E.midiasSoWifi=true;
  if(!E.sinc) E.sinc={ultima:null,erro:null};
  if(!E.aparelhos) E.aparelhos={};
}
var E;
try{ E = JSON.parse(localStorage.getItem(CHAVE)) || novoEstado(); }catch(e){ E = novoEstado(); }
completarEstado();
function salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(E)); }catch(e){ toast('Não foi possível salvar: memória cheia'); } }

/* ---------- utilidades ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function dois(n){ return (n<10?'0':'')+n; }
function dataBR(iso){ var d=new Date(iso); return dois(d.getDate())+'/'+dois(d.getMonth()+1)+'/'+d.getFullYear(); }
function horaBR(iso){ var d=new Date(iso); return dois(d.getHours())+':'+dois(d.getMinutes()); }
function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('vis'); clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove('vis');},2200); }
function visitaAtual(){ if(!E.atual) return null; for(var i=0;i<E.visitas.length;i++) if(E.visitas[i].id===E.atual) return E.visitas[i]; return null; }
function acharVisita(id){ for(var i=0;i<E.visitas.length;i++) if(E.visitas[i].id===id) return E.visitas[i]; return null; }
function colInfo(n){ var c=E.colonias[n-1]; var p=[]; if(c.especie)p.push(c.especie); if(c.ambiente)p.push(c.ambiente); if(c.melgueira)p.push('melgueira '+c.melgueira.toLowerCase()); if(c.aparelho)p.push('aparelho '+c.aparelho); return p.join(' · '); }
function camposUso(){ return semBluetooth()?CAMPOS.filter(function(c){ return c.id!=='dados'; }):CAMPOS; }
function problemas(r){
  var lista=[]; if(!r) return lista;
  camposUso().forEach(function(c){ if(c.ruins && c.ruins.indexOf(r[c.id])>=0) lista.push(c.id); });
  return lista;
}
function completo(r){ if(!r) return false; var cs=camposUso(); for(var i=0;i<cs.length;i++) if(!r[cs[i].id]) return false; return true; }
function compartilhar(texto,titulo){
  if(window.Android && Android.compartilhar){ Android.compartilhar(texto,titulo||'Monitor Meliponas'); }
  else if(navigator.share){ navigator.share({title:titulo,text:texto}); }
  else { prompt('Copie o texto:',texto); }
}

/* ---------- cabeçalho e abas ---------- */
function cabecalho(){
  $('hQuem').textContent = E.monitor || 'Monitor';
  var d=new Date();
  $('hQuando').textContent = DIAS[d.getDay()]+', '+dataBR(d.toISOString());
  mostrarSinc();
}
var abaAtual='visita';
function irAba(a){
  abaAtual=a;
  ['visita','historico','guia','ajustes'].forEach(function(x){ $('aba-'+x).classList.toggle('oculto',x!==a); });
  var bs=document.querySelectorAll('nav button'); for(var i=0;i<bs.length;i++) bs[i].classList.toggle('ativo', bs[i].getAttribute('data-aba')===a);
  ({visita:telaVisita,historico:telaHistorico,guia:telaGuia,ajustes:telaAjustes})[a]();
  window.scrollTo(0,0);
}

/* ---------- aba visita ---------- */
function ultimaVisitaFinalizada(){
  var f=E.visitas.filter(function(v){return v.fim;}); return f.length? f[f.length-1] : null;
}
function telaVisita(){
  var v=visitaAtual(), h='';
  if(!v){
    var ult=ultimaVisitaFinalizada();
    h+='<div class="cartao"><h2 style="margin-top:0">Visita da semana</h2>';
    if(E.agenda.dia) h+='<p>Seu dia de visita: <b>'+esc(E.agenda.dia)+(E.agenda.hora?', '+esc(E.agenda.hora):'')+'</b></p>';
    else h+='<p class="suave">Combine o dia e o horário da visita e anote em Ajustes.</p>';
    if(ult){
      var dias=Math.floor((Date.now()-new Date(ult.inicio).getTime())/86400000);
      h+='<p>Última visita: <b>'+dataBR(ult.inicio)+'</b> ('+(dias===0?'hoje':dias===1?'ontem':'há '+dias+' dias')+')</p>';
      if(dias>7) h+='<div class="aviso">Já passou mais de uma semana desde a última visita.</div>';
    }
    h+='<button class="botao verde" onclick="comecarVisita()">Começar visita</button></div>';
    h+='<div class="dica"><b>Antes de sair:</b> carregue o celular, ligue o Bluetooth e leve um pano limpo para a placa solar.</div>';
    var semVinc=E.colonias.filter(function(c){return !c.aparelho;}).length;
    if(semVinc) h+='<div class="cartao"><b>'+semVinc+' colônia(s)</b> sem aparelho de medição vinculado. Vincule em Ajustes &gt; Identificação das colônias ou na própria visita.</div>';
  } else {
    var feitas=0, comProb=0;
    for(var n=1;n<=12;n++){ var r=v.col[n]; if(completo(r)){feitas++; if(problemas(r).length)comProb++;} }
    h+='<div class="cartao"><h2 style="margin-top:0">Visita em andamento</h2>';
    h+='<p class="suave">Começou '+dataBR(v.inicio)+' às '+horaBR(v.inicio)+'</p>';
    h+='<div class="barra"><span style="width:'+(feitas/12*100)+'%"></span></div>';

var gravando=false, tGrav=null, inicioGrav=0;

function contarMidias(v){ var f=0,a=0; for(var n=1;n<=12;n++){ var r=v.col[n]; if(r&&r.midias) r.midias.forEach(function(m){ m.tipo==='foto'?f++:a++; }); } return {fotos:f,audios:a}; }

/* ---------- sincronização com o servidor ---------- */
var sincronizando=false;
function rede(){ if(temPonte('rede')) return Android.rede(); return navigator.onLine?'wifi':'nenhuma'; }
function servidorPronto(){ return E.servidor && E.servidor.url && E.servidor.chave && E.servidor.codigo; }
function urlBase(){ return E.servidor.url.replace(/\/+$/,''); }
function cab(extra){ var h={'apikey':E.servidor.chave,'Authorization':'Bearer '+E.servidor.chave}; for(var k in extra) h[k]=extra[k]; return h; }
function visitaPendente(v){ return v.fim && (!v.sincEm || (v.alterado||0) > v.sincEm); }
function midiasPendentes(){
  var lista=[]; E.visitas.forEach(function(v){ if(!v.fim) return; for(var n=1;n<=12;n++){ var r=v.col[n]; if(r&&r.midias) r.midias.forEach(function(m){ if(!m.enviado) lista.push({v:v,n:n,m:m}); }); } });
  return lista;
}
function contarPendencias(){ return {visitas:E.visitas.filter(visitaPendente).length, midias:midiasPendentes().length, lotes:lotesPendentes().length}; }
function mostrarSinc(){
  var el=$('hSinc'); if(!el) return;
  if(!servidorPronto()){ el.innerHTML='Sincronização não configurada'; return; }
  if(sincronizando){ el.innerHTML='<b>Sincronizando…</b>'; return; }
  var p=contarPendencias();
  if(!p.visitas && !p.midias && !p.lotes) el.innerHTML='Tudo sincronizado'+(E.sinc.ultima?' · '+dataBR(E.sinc.ultima)+' '+horaBR(E.sinc.ultima):'');
  else el.innerHTML='<b>A enviar: '+[p.visitas?p.visitas+' visita(s)':'',p.midias?p.midias+' foto(s)/áudio(s)':'',p.lotes?'medições de '+p.lotes+' download(s)':''].filter(Boolean).join(', ')+'</b>';
}
function linhaRegistro(n,r){
  var d=r.download&&r.download.ok?r.download:null;
  return {leitura:d?{aparelho:d.id,agora:d.agora,n:d.n,primeiro:d.primeiro,ultimo:d.ultimo,quando:d.quando}:null,colonia:n,hora:r.hora||null,dados:r.dados||null,mov:r.mov||null,pragas:r.pragas||null,pragaQual:r.pragaQual||null,caixa:r.caixa||null,
    placa:r.placa||null,aparelho:r.aparelho||null,manejo:r.manejo||null,obs:r.obs||null,problemas:problemas(r)};
}
function rpc(payload){
  return fetch(urlBase()+'/rest/v1/rpc/sincronizar',{method:'POST',headers:cab({'Content-Type':'application/json'}),body:JSON.stringify({p:payload})})
    .then(function(resp){ return resp.text().then(function(t){ if(!resp.ok){ var m=t; try{ m=JSON.parse(t).message||t; }catch(e){} throw new Error(m); } return t; }); });
}
function b64ParaBytes(b64){ var bin=atob(b64), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function caminhoMidia(v,m){ return 'visitas/'+v.id+'/'+m.id+(m.tipo==='audio'?'.m4a':'.jpg'); }
function enviarArquivo(item){
  return Promise.resolve(temPonte('lerMidiaBase64')?Android.lerMidiaBase64(item.m.id,item.m.tipo):'').then(function(b64){
  if(!b64) throw new Error('arquivo não encontrado no celular');
  var tipo=item.m.tipo==='audio'?'audio/mp4':'image/jpeg';
  return fetch(urlBase()+'/storage/v1/object/midias/'+caminhoMidia(item.v,item.m),{method:'POST',headers:cab({'Content-Type':tipo}),body:b64ParaBytes(b64)})
    .then(function(resp){ return resp.text().then(function(t){
      if(resp.ok || /Duplicate|already exists/i.test(t) || resp.status===409) return true;
      throw new Error('envio de arquivo: '+resp.status+' '+t.slice(0,120)); }); });
  });
}
function sincronizar(manual){
  if(sincronizando) return Promise.resolve();
  if(!servidorPronto()){ if(manual) toast('Configure a sincronização em Ajustes'); return Promise.resolve(); }
  var r0=rede();
  if(r0==='nenhuma'){ if(manual) toast('Sem internet agora. Os dados ficam guardados no celular.'); return Promise.resolve(); }
  var pend=E.visitas.filter(visitaPendente);
  var podeMidia = r0==='wifi' || !E.midiasSoWifi;
  var midias=podeMidia?midiasPendentes():[];
  var lotes=podeMidia?lotesPendentes():[];
  if(!pend.length && !midias.length && !lotes.length){ if(manual){ toast(midiasPendentes().length||lotesPendentes().length?'Fotos, áudios e medições aguardam uma rede Wi-Fi':'Tudo já está sincronizado'); } return Promise.resolve(); }
  sincronizando=true; mostrarSinc();
  var marca=Date.now();
  var payload={codigo:E.servidor.codigo,dispositivo:E.dispositivo,monitor:E.monitor,versao:temPonte('versao')?Android.versao():'web',
    colonias:E.colonias,
    visitas:pend.map(function(v){ var regs=[]; for(var n=1;n<=12;n++) if(v.col[n] && v.col[n].mov!==undefined || (v.col[n]&&v.col[n].dados)) regs.push(linhaRegistro(n,v.col[n]));
      return {id:v.id,monitor:v.monitor,inicio:v.inicio,fim:v.fim,enviadoSistema:!!v.enviadoSistema,registros:regs}; }),
    midias:[]};
  var enviados=[], erroMidia=null;
  return rpc(payload).then(function(){
    pend.forEach(function(v){ v.sincEm=marca; }); salvar();
    // arquivos, um por vez
    return midias.reduce(function(pr,item){ return pr.then(function(){ return enviarArquivo(item).then(function(){ enviados.push(item); }).catch(function(e){ erroMidia=e; }); }); }, Promise.resolve());
  }).then(function(){
    if(!enviados.length) return;
    return rpc({codigo:E.servidor.codigo,dispositivo:E.dispositivo,monitor:E.monitor,visitas:[],colonias:[],
      midias:enviados.map(function(it){ return {id:it.m.id,visita:it.v.id,colonia:it.n,tipo:it.m.tipo,caminho:caminhoMidia(it.v,it.m),duracao:it.m.duracao||null,tamanho:it.m.tamanho||null,criado:it.m.criado||null}; })})
      .then(function(){ enviados.forEach(function(it){ it.m.enviado=true; }); salvar(); });
  }).then(function(){
    // medições dos aparelhos, um download por vez
    return lotes.reduce(function(pr,nome){ return pr.then(function(){ return enviarLote(nome).catch(function(e){ erroMidia=e; }); }); }, Promise.resolve());
  }).then(function(){
    E.sinc.ultima=new Date().toISOString(); E.sinc.erro=erroMidia?String(erroMidia.message):null; salvar();
    var resto=midiasPendentes().length;
    if(manual || pend.length) toast(erroMidia?'Parte das fotos/áudios não foi enviada. Tente de novo.':(resto&&!podeMidia?'Visitas enviadas. Fotos e áudios aguardam Wi-Fi.':'Dados enviados ao servidor'));
  }).catch(function(e){
    E.sinc.erro=String(e.message||e); salvar();
    if(manual) toast('Não foi possível sincronizar: '+E.sinc.erro);
  }).then(function(){ sincronizando=false; mostrarSinc(); if(abaAtual==='ajustes') telaAjustes(); if(abaAtual==='historico') telaHistorico();
    if(resumoId){ var y=$('telaResumo').scrollTop; abrirResumo(resumoId); $('telaResumo').scrollTop=y; } });
}
function testarServidor(){
  if(!servidorPronto()){ toast('Preencha os três campos'); return; }
  fetch(urlBase()+'/rest/v1/rpc/testar_codigo',{method:'POST',headers:cab({'Content-Type':'application/json'}),body:JSON.stringify({codigo:E.servidor.codigo})})
   .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.message||r.status); return j; }); })
   .then(function(ok){ alert(ok===true?'Conexão funcionando. O código do projeto está correto.':'O servidor respondeu, mas o código do projeto está errado.'); })
   .catch(function(e){ alert('Não foi possível conectar: '+e.message); });
}
window.aoVoltarAoApp=function(){ cabecalho(); if(rede()==='wifi') sincronizar(false); };
setInterval(function(){ if(!sincronizando && rede()==='wifi' && (contarPendencias().visitas||contarPendencias().midias)) sincronizar(false); }, 120000);

/* ---------- aparelho de medição BeeMeter (Bluetooth) ---------- */
var baixando=null, bleTexto='', blePct=0;
function fmtNum(v,u,dec){ return v==null||isNaN(v)?'—':(+v).toFixed(dec)+u; }
function leiturasHTML(a){

    '<div style="grid-column:span 3"><b>'+fmtNum(a.peso,' kg',3)+'</b><span>Peso da colmeia</span></div></div>';

function dataHora(seg){ var d=new Date(seg*1000).toISOString(); return dataBR(d)+' '+horaBR(d); }
function cartaoAparelho(n,r){
  var c=E.colonias[n-1], d=r.download||null, h='';

  if(!c.aparelho) return '<div class="aparelho"><div class="tit">Aparelho de medição</div><p class="suave" style="margin:6px 0 0">Nenhum aparelho vinculado a esta colônia.</p><button class="botao claro" onclick="abrirBusca('+n+')">Procurar e vincular aparelho</button></div>';
  h+='<div class="aparelho'+(d&&d.ok?' ok':(d&&d.erro?' falha':''))+'"><div class="tit"><span>Aparelho de medição</span><span class="id">'+esc(c.aparelho)+'</span></div>';
  if(baixando===n){
    h+='<p id="bleTxt" style="margin:8px 0 0">'+esc(bleTexto)+'</p><div class="progresso"><span id="blePct" style="width:'+blePct+'%"></span></div><button class="botao claro" onclick="cancelarDownload()">Cancelar</button>';
  } else if(d&&d.ok){
    h+='<p style="margin:8px 0 0">Baixado às '+horaBR(new Date(d.quando*1000).toISOString())+': <b>'+d.n+' registro(s) novo(s)</b>'+(d.mIni?' ('+dataHora(d.mIni)+' a '+dataHora(d.mFim)+')':'')+'.</p>'+leiturasHTML(d.agora)+
       '<button class="botao claro" onclick="baixarAparelho('+n+')">Baixar de novo</button>';
  } else {
    if(d&&d.erro) h+='<p style="margin:8px 0 0;color:var(--alerta)">'+esc(d.erro)+'</p>';
    h+='<button class="botao" onclick="baixarAparelho('+n+')">'+(d&&d.erro?'Tentar de novo':'Baixar dados do aparelho')+'</button>';
  }
  return h+'</div>';
}
function baixarAparelho(n){
  if(!temPonte('bleBaixar')){ toast('O download funciona só no aplicativo instalado'); return; }

window.bleProgresso=function(chave,txt,pct){

window.bleErro=function(chave,msg){

function medicoesVisita(v){

/* busca e vínculo */
var buscaColonia=null, buscando=false, achados={}, buscaErro=null;
function abrirBusca(n){

function sinal(r){ return r>-60?'muito perto':r>-75?'perto':r>-88?'longe':'muito longe'; }

function desenharBusca(){
  var ids=Object.keys(achados).sort(function(a,b){ return achados[b].rssi-achados[a].rssi; }), h='';
  if(buscaErro) h+='<div class="aviso">'+esc(buscaErro)+'</div>';

function escolherAparelho(id){

/* lotes de medições guardados no celular */
function lotesPendentes(){ try{ return temPonte('lotesPendentes')?JSON.parse(Android.lotesPendentes()):[]; }catch(e){ return []; } }
function rpcFn(fn,payload){
  return fetch(urlBase()+'/rest/v1/rpc/'+fn,{method:'POST',headers:cab({'Content-Type':'application/json'}),body:JSON.stringify({p:payload})})
    .then(function(resp){ return resp.text().then(function(t){ if(!resp.ok){ var m=t; try{ m=JSON.parse(t).message||t; }catch(e){} throw new Error(m); } return t; }); });
}
function enviarLote(nome){
  return Promise.resolve(Android.lerLote(nome)).then(function(txt){
  if(!txt){ Android.apagarLote(nome); return; }
  var lote=JSON.parse(txt), regs=lote.registros||[], partes=[];
  for(var i=0;i<regs.length;i+=400) partes.push(regs.slice(i,i+400));
  return partes.reduce(function(pr,parte){ return pr.then(function(){
    return rpcFn('enviar_medicoes',{codigo:E.servidor.codigo,dispositivo:E.dispositivo,aparelho:lote.aparelho,colonia:lote.colonia,fw:lote.fw,registros:parte});
  }); }, Promise.resolve()).then(function(){ Android.apagarLote(nome); });
  });
}

/* ---------- relatório ---------- */
function linhaCol(n,r){
  if(!r || !completo(r)) return 'Col. '+n+': não registrada';
  var t='Col. '+n+': dados '+r.dados+' | movimento '+r.mov+' | pragas '+r.pragas+(r.pragaQual?' ('+r.pragaQual+')':'')+' | caixa '+r.caixa+' | placa e fios '+r.placa+' | aparelho '+r.aparelho;
  if(r.manejo && r.manejo!=='Nenhum') t+=' | manejo: '+r.manejo;
  if(r.download&&r.download.ok&&r.download.agora){ var a=r.download.agora, tc=a.tc||[]; t+=' | peso '+fmtNum(a.peso,' kg',2)+' | ninho '+fmtNum(tc[0],'°C',1); }
  if(r.obs) t+=' | obs: '+r.obs;
  return t;
}
function nomeProb(id,r){
  return {dados:'dados não baixados',mov:'sem movimento de abelhas',pragas:'pragas'+(r.pragaQual?' ('+r.pragaQual+')':''),caixa:'caixa com estrago',placa:'placa ou fios danificados',aparelho:'aparelho '+(r.aparelho||'').toLowerCase()}[id];
}
function textoRelatorio(v){
  var feitas=0,baix=0,probs=[],manejos=[];
  for(var n=1;n<=12;n++){ var r=v.col[n]; if(completo(r)){feitas++; if(r.dados==='Sim')baix++; var p=problemas(r); if(p.length) probs.push('Col. '+n+': '+p.map(function(x){return nomeProb(x,r);}).join(', ')); if(r.manejo&&r.manejo!=='Nenhum') manejos.push('Col. '+n+': '+r.manejo);} }
  var t='VISITA SEMANAL — MELIPONICULTURA FIS\nMonitor: '+v.monitor+'\nData: '+dataBR(v.inicio)+', das '+horaBR(v.inicio)+(v.fim?' às '+horaBR(v.fim):'')+'\nColônias registradas: '+feitas+' de 12\nDados baixados: '+baix+' de 12\n';
  var mvt=medicoesVisita(v); if(mvt.vinc) t+='Medições dos aparelhos: '+mvt.ok+' de '+mvt.vinc+'\n';
  var cm=contarMidias(v); if(cm.fotos||cm.audios) t+='Fotos: '+cm.fotos+' · Áudios: '+cm.audios+' (enviados pelo aplicativo)\n';
  t+= probs.length? '\nATENÇÃO — PROBLEMAS:\n'+probs.join('\n')+'\n' : '\nNenhum problema encontrado.\n';
  if(manejos.length) t+='\nManejo feito:\n'+manejos.join('\n')+'\n';
  t+='\nDetalhe por colônia:\n'; for(n=1;n<=12;n++) t+=linhaCol(n,v.col[n])+'\n';
  return t;
}
function textoAviso(v){
  var probs=[];
  for(var n=1;n<=12;n++){ var r=v.col[n]; var p=problemas(r); if(p.length) probs.push('Colônia '+n+': '+p.map(function(x){return nomeProb(x,r);}).join(', ')+(r.obs?' — '+r.obs:'')); }
  return 'AVISO DE PROBLEMA — Meliponicultura FIS\n'+v.monitor+', visita de '+dataBR(v.inicio)+'\n\n'+probs.join('\n')+'\n\nAs fotos e áudios seguem pela sincronização do aplicativo.';
}

function telaAjustes(){
  var h='<h2>Ajustes</h2><div class="cartao"><h3 style="margin-top:0">Monitor deste celular</h3><div class="opcoes">';
  ['Sr. Jatir','Dona Maria Diniz'].forEach(function(m){ h+='<button class="'+(E.monitor===m?'sel':'')+'" onclick="escolherMonitor(\''+m+'\',true)">'+m+'</button>'; });
  h+='</div><h3>Dia e horário da visita</h3><div class="linha2"><select onchange="E.agenda.dia=this.value;salvar()"><option value="">Dia</option>';
  DIAS.forEach(function(d){ h+='<option'+(E.agenda.dia===d?' selected':'')+'>'+d+'</option>'; });
  h+='</select><input type="time" value="'+esc(E.agenda.hora)+'" onchange="E.agenda.hora=this.value;salvar()"></div></div>';
  h+='<div class="cartao"><h3 style="margin-top:0">Identificação das colônias</h3><p class="suave">Preencher na instalação, junto com a equipe técnica.</p>';
  for(var n=1;n<=12;n++){
    var c=E.colonias[n-1];
    h+='<details style="border-color:var(--linha)"><summary style="font-size:17px">Colônia '+n+(colInfo(n)?' <span class="suave" style="font-weight:400">· '+esc(colInfo(n))+'</span>':'')+'</summary><div class="det">'+
     sel(n,'especie','Espécie',['Melipona interrupta','Melipona seminigra'])+
     sel(n,'ambiente','Ambiente',['Igapó','Terra firme'])+
     sel(n,'melgueira','Melgueira',['Nova','Antiga'])+
     '<label class="suave" style="display:block;margin-top:10px">Aparelho de medição</label><div style="display:flex;gap:8px"><input placeholder="BM-……" value="'+esc(c.aparelho)+'" onchange="E.colonias['+(n-1)+'].aparelho=this.value.trim().toUpperCase();salvar()"><button class="botao claro" style="width:auto;margin:0;padding:8px 14px;font-size:15px" onclick="abrirBusca('+n+')">Procurar</button></div>'+
     '<label class="suave" style="display:block;margin-top:10px">Local / meliponário</label><input value="'+esc(c.local)+'" onchange="E.colonias['+(n-1)+'].local=this.value;salvar()"></div></details>';
  }
  h+='</div><div class="cartao"><h3 style="margin-top:0">Aparelhos de medição</h3>';
  var lig=E.colonias.filter(function(c){return c.aparelho;});
  if(!lig.length) h+='<p class="suave">Nenhum aparelho vinculado ainda.</p>';
  else { h+='<table><tr><th>Colônia</th><th>Aparelho</th><th>Último download</th></tr>'; E.colonias.forEach(function(c){ if(!c.aparelho) return; var a=E.aparelhos[c.aparelho]||{}; h+='<tr><td>'+c.n+'</td><td>'+esc(c.aparelho)+'</td><td>'+(a.ultimoDownload?dataBR(a.ultimoDownload)+' '+horaBR(a.ultimoDownload):'—')+'</td></tr>'; }); h+='</table>'; }
  h+='<button class="botao claro" onclick="abrirBusca(0)">Procurar aparelhos por perto</button>';
  h+='</div><div class="cartao"><h3 style="margin-top:0">Cópia de segurança</h3><p class="suave">Os registros ficam no celular até a sincronização. Se a sincronização não estiver funcionando, envie uma cópia para a equipe.</p>'+
   '<button class="botao claro" onclick="compartilhar(JSON.stringify(E),\'Cópia de segurança — Monitor Meliponas\')">Enviar cópia de segurança</button>'+
   '<button class="botao claro" onclick="restaurar()">Restaurar uma cópia</button></div>';
  var pc=contarPendencias();
  h+='<div class="cartao"><h3 style="margin-top:0">Sincronização com o servidor</h3>'+
    '<p>'+(servidorPronto()?(pc.visitas||pc.midias||pc.lotes?'A enviar: '+pc.visitas+' visita(s), '+pc.midias+' foto(s)/áudio(s) e medições de '+pc.lotes+' download(s).':'Tudo sincronizado.'):'Ainda não configurada.')+
    (E.sinc.ultima?'<br><span class="suave">Último envio: '+dataBR(E.sinc.ultima)+' às '+horaBR(E.sinc.ultima)+'</span>':'')+
    (E.sinc.erro?'<br><span style="color:var(--alerta)">Último erro: '+esc(E.sinc.erro)+'</span>':'')+'</p>'+
    '<label style="display:flex;gap:12px;align-items:center;margin:8px 0"><input type="checkbox" style="width:24px;height:24px" '+(E.midiasSoWifi?'checked':'')+' onchange="E.midiasSoWifi=this.checked;salvar()"> Enviar fotos, áudios e medições só no Wi-Fi</label>'+
    '<button class="botao verde" onclick="sincronizar(true)">Sincronizar agora</button>'+
    '<details style="margin-top:12px"><summary style="font-size:16px">Dados do servidor (equipe técnica)</summary><div class="det">'+
    '<label class="suave">Endereço do servidor</label><input placeholder="https://xxxx.supabase.co" value="'+esc(E.servidor.url)+'" onchange="E.servidor.url=this.value.trim();salvar();mostrarSinc()">'+
    '<label class="suave" style="display:block;margin-top:10px">Chave pública (anon)</label><input value="'+esc(E.servidor.chave)+'" onchange="E.servidor.chave=this.value.trim();salvar();mostrarSinc()">'+
    '<label class="suave" style="display:block;margin-top:10px">Código do projeto</label><input value="'+esc(E.servidor.codigo)+'" onchange="E.servidor.codigo=this.value.trim();salvar();mostrarSinc()">'+
    '<button class="botao claro" onclick="testarServidor()">Testar conexão</button></div></details></div>';
  if(window.MM_WEB) h+='<div class="cartao" style="text-align:center"><h3 style="margin-top:0">Instalar em outro celular</h3><p class="suave">Aponte a câmera para o código e, no Safari, toque em Compartilhar &gt; Adicionar à Tela de Início.</p><img src="qr-web.png" alt="QR code da versão web" style="width:220px;height:220px;border:8px solid var(--mel);border-radius:14px"><p class="suave" style="margin-top:8px">andersonsakuma.github.io/monitor-meliponas/app</p></div>';
  else if(window.MM_IOS) h+='<div class="cartao"><h3 style="margin-top:0">Instalar em outro celular</h3><p class="suave">No iPhone, a instalação é pelo aplicativo TestFlight, com o convite enviado pela equipe técnica. Em celulares Android, use o QR code da folha de instalação.</p></div>';
  else h+='<div class="cartao" style="text-align:center"><h3 style="margin-top:0">Instalar em outro celular</h3><p class="suave">Peça para a outra pessoa apontar a câmera do celular para este código.</p><img src="qr-app.png" alt="QR code do aplicativo" style="width:220px;height:220px;border:8px solid var(--mel);border-radius:14px"><p class="suave" style="margin-top:8px">github.com/andersonsakuma/monitor-meliponas/releases/latest</p></div>';
  h+=LOGOS_HTML+'<p class="suave" style="text-align:center">Monitor Meliponas 3.0 · FIS | IPÊ · Amazônia Bee</p>';
  $('aba-ajustes').innerHTML=h;
}
function sel(n,campo,rot,ops){
  var c=E.colonias[n-1], h='<label class="suave" style="display:block;margin-top:10px">'+rot+'</label><select onchange="E.colonias['+(n-1)+'].'+campo+'=this.value;salvar()"><option value="">—</option>';
  ops.forEach(function(o){ h+='<option'+(c[campo]===o?' selected':'')+'>'+o+'</option>'; });
  return h+'</select>';
}
function restaurar(){
  var t=prompt('Cole aqui o texto da cópia de segurança:'); if(!t) return;
  try{ var d=JSON.parse(t); if(!d.visitas||!d.colonias) throw 0;
    if(!confirm('Substituir todos os dados deste celular pela cópia?')) return;
    E=d; salvar(); cabecalho(); irAba('ajustes'); toast('Cópia restaurada');
  }catch(e){ alert('O texto colado não é uma cópia de segurança válida.'); }
}
function escolherMonitor(m, deAjustes){
  E.monitor=m; salvar(); $('boasVindas').classList.remove('aberta'); cabecalho();
  if(deAjustes){ telaAjustes(); toast('Monitor: '+m); } else irAba('visita');
}

/* ---------- botão voltar do Android ---------- */
window.voltar=function(){
  if($('telaBusca').classList.contains('aberta')){ fecharBusca(); return true; }
  if($('formColonia').classList.contains('aberta')){ if(baixando){ toast('Aguarde o download do aparelho'); return true; } fecharColonia(); return true; }
  if($('telaResumo').classList.contains('aberta')){ fecharResumo(); return true; }
  if(abaAtual!=='visita'){ irAba('visita'); return true; }
  return false;
};

/* ---------- início ---------- */
cabecalho();
if(!E.monitor) $('boasVindas').classList.add('aberta');
irAba('visita');
setTimeout(function(){ sincronizar(false); }, 1500);
</script>
